# SonarQube Cloud : remplacez les deux valeurs ci-dessous par celles de VOTRE projet
# (SonarQube Cloud > votre projet > Information). Tant que le secret SONAR_TOKEN
# n'existe pas dans le depot, le workflow sonar.yml saute l'analyse.
sonar.organization=A_REMPLACER_organisation
sonar.projectKey=A_REMPLACER_cle_du_projet

sonar.python.version=3.12

# Pas d'analyse des dependances ni des rapports generes
sonar.exclusions=**/node_modules/**,qa/reports/**

# Rapports externes produits par le workflow (un jeu par module : racine et qa/)
sonar.python.bandit.reportPaths=bandit-report.json
sonar.python.ruff.reportPaths=ruff-report.json

# Le job echoue si la quality gate est rouge
sonar.qualitygate.wait=true
